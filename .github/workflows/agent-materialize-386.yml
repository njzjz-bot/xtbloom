name: Agent materialize 386

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  materialize:
    if: github.head_ref == 'feat/386-gfn1-cuda'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Apply exact GFN1 CUDA source patch
        shell: bash
        run: |
          cat .github/agent/x4.* | base64 -d | gzip -d > /tmp/386.patch
          git apply --check \
            --exclude='.github/agent/**' \
            --exclude='.github/workflows/agent-source-snapshot.yml' \
            /tmp/386.patch
          git apply \
            --exclude='.github/agent/**' \
            --exclude='.github/workflows/agent-source-snapshot.yml' \
            /tmp/386.patch
          git diff --check
          rm -rf .github/agent .github/workflows/agent-source-snapshot.yml
      - name: Upload exact materialized source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: agent-386-materialized-source
          path: |
            .
            !.git
          include-hidden-files: true
          retention-days: 1
