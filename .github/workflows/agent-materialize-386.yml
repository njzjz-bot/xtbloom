name: Agent materialize 386

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/386-materialize-input
          fetch-depth: 0
          persist-credentials: true
      - name: Publish readable GFN1 CUDA source
        shell: bash
        run: |
          cat .github/agent/full2.* | base64 -d | gzip -d > /tmp/386.patch
          git apply --check \
            --exclude='.github/agent/**' \
            --exclude='.github/workflows/agent-source-snapshot.yml' \
            /tmp/386.patch
          git apply \
            --exclude='.github/agent/**' \
            --exclude='.github/workflows/agent-source-snapshot.yml' \
            /tmp/386.patch
          git diff --check
          rm -rf .github/agent .github/workflows/agent-source-snapshot.yml
          git config user.name "njzjz-bot"
          git config user.email "48687836+njzjz-bot@users.noreply.github.com"
          git add -A
          git commit -m "feat: materialize readable GFN1 CUDA source" \
            -m "Refs #386" \
            -m "Agent: ChatGPT" \
            -m "Model: GPT-5.6 Sol"
          git push --force origin HEAD:agent/386-readable-source
