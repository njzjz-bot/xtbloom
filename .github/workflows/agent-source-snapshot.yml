name: Agent CUDA compile

on:
  push:
    branches:
      - feat/386-gfn1-cuda

permissions:
  contents: read

jobs:
  cuda-compile:
    runs-on: ubuntu-24.04
    container:
      image: nvidia/cuda:12.8.1-devel-ubuntu24.04
    steps:
      - name: Install build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates cmake g++ gcc git ninja-build python3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Apply agent worktree patch
        shell: bash
        run: |
          cat "$GITHUB_WORKSPACE"/.github/agent/386.patch.b64.* | base64 -d | gzip -d > /tmp/386.patch
          git -C "$GITHUB_WORKSPACE" apply --check /tmp/386.patch
          git -C "$GITHUB_WORKSPACE" apply /tmp/386.patch
          git -C "$GITHUB_WORKSPACE" diff --check
      - name: Configure CUDA compiler check
        run: |
          cmake -S "$GITHUB_WORKSPACE" -B "$GITHUB_WORKSPACE/build-agent" -G Ninja \
            -DXTBLOOM_ENABLE_CUDA=ON \
            -DXTBLOOM_BUILD_TESTS=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_ARCHITECTURES=80
      - name: Compile CUDA backend
        run: cmake --build "$GITHUB_WORKSPACE/build-agent" --target xtbloom_cuda_backend --parallel 2
