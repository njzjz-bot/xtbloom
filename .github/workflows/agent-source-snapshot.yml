name: Agent CUDA compile

on:
  push:
    branches:
      - feat/386-gfn1-cuda

permissions:
  contents: read

jobs:
  cuda-compile:
    runs-on: ubuntu-24.04
    container:
      image: nvidia/cuda:12.8.1-devel-ubuntu24.04
    steps:
      - name: Install build tools
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -qq -y --no-install-recommends \
            ca-certificates cmake g++ gcc git ninja-build python3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Apply exact agent worktree patch
        shell: bash
        run: |
          repo=/__w/xtbloom/xtbloom
          git config --global --add safe.directory "$repo"
          cat "$repo"/.github/agent/x4.* | base64 -d | gzip -d > /tmp/386.patch
          git -C "$repo" apply --check /tmp/386.patch
          git -C "$repo" apply /tmp/386.patch
          git -C "$repo" diff --check
      - name: Configure CUDA compiler check
        run: |
          repo=/__w/xtbloom/xtbloom
          cmake -S "$repo" -B "$repo/build-agent" -G Ninja \
            -DXTBLOOM_ENABLE_CUDA=ON \
            -DXTBLOOM_BUILD_TESTS=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_ARCHITECTURES=80
      - name: Compile CUDA backend
        shell: bash
        run: |
          set -o pipefail
          cmake --build /__w/xtbloom/xtbloom/build-agent --target xtbloom_cuda_backend --parallel 2 \
            2>&1 | tee /tmp/cuda-build.log
      - name: Upload CUDA build diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: agent-cuda-build-log
          path: /tmp/cuda-build.log
          if-no-files-found: ignore
          retention-days: 1
