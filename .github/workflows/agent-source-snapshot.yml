name: Agent GFN1 CUDA staging

on:
  push:
    branches:
      - feat/386-gfn1-cuda

permissions:
  contents: write
  statuses: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Publish exact source worktree
        shell: bash
        run: |
          cat .github/agent/x4.* | base64 -d | gzip -d > /tmp/386.patch
          git apply --check \
            --exclude='.github/agent/**' \
            --exclude='.github/workflows/agent-source-snapshot.yml' \
            /tmp/386.patch
          git apply \
            --exclude='.github/agent/**' \
            --exclude='.github/workflows/agent-source-snapshot.yml' \
            /tmp/386.patch
          git diff --check
          rm -rf .github/agent .github/workflows/agent-source-snapshot.yml
          git config user.name "njzjz-bot"
          git config user.email "48687836+njzjz-bot@users.noreply.github.com"
          git add -A
          git commit -m "feat: stage GFN1 CUDA execution" \
            -m "Agent: ChatGPT" \
            -m "Model: GPT-5.6 Sol"
          git push --force origin HEAD:agent/386-cuda-result

  cuda-compile:
    runs-on: ubuntu-24.04
    container:
      image: nvidia/cuda:12.8.1-devel-ubuntu24.04
    steps:
      - name: Install build tools
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -qq -y --no-install-recommends \
            ca-certificates cmake g++ gcc git ninja-build python3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Apply exact source patch
        shell: bash
        run: |
          repo=/__w/xtbloom/xtbloom
          git config --global --add safe.directory "$repo"
          cat "$repo"/.github/agent/x4.* | base64 -d | gzip -d > /tmp/386.patch
          git -C "$repo" apply --check \
            --exclude='.github/agent/**' \
            --exclude='.github/workflows/agent-source-snapshot.yml' \
            /tmp/386.patch
          git -C "$repo" apply \
            --exclude='.github/agent/**' \
            --exclude='.github/workflows/agent-source-snapshot.yml' \
            /tmp/386.patch
          git -C "$repo" diff --check
      - name: Compile staged CUDA backend
        shell: bash
        run: |
          repo=/__w/xtbloom/xtbloom
          set +e
          set -o pipefail
          {
            cmake -S "$repo" -B "$repo/build-agent" -G Ninja \
              -DXTBLOOM_ENABLE_CUDA=ON \
              -DXTBLOOM_BUILD_TESTS=OFF \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_CUDA_ARCHITECTURES=80 &&
            cmake --build "$repo/build-agent" --target xtbloom_cuda_backend --parallel 2
          } 2>&1 | tee /tmp/cuda-build.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -eq 0 ]; then
            echo success > /tmp/state
            echo 'GFN1 CUDA staged source compiles with CUDA 12.8' > /tmp/description
          else
            echo failure > /tmp/state
            grep -m1 -E '(^|: )(fatal error|error:|FAILED:)' /tmp/cuda-build.log \
              | sed 's/[[:space:]]\+/ /g' | cut -c1-135 > /tmp/description || true
            if [ ! -s /tmp/description ]; then
              echo "GFN1 CUDA staged compile failed (rc=$rc)" > /tmp/description
            fi
          fi
          echo "$rc" > /tmp/rc
          exit 0
      - name: Report compile status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export state="$(cat /tmp/state)"
          export description="$(cat /tmp/description)"
          python3 - <<'PY'
          import json, os, urllib.request
          body = json.dumps({
              "state": os.environ["state"],
              "context": "agent/gfn1-cuda-compile",
              "description": os.environ["description"],
          }).encode()
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['GITHUB_SHA']}",
              data=body,
              method="POST",
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(req) as response:
              if response.status != 201:
                  raise SystemExit(f"unexpected status API response: {response.status}")
          PY
          exit "$(cat /tmp/rc)"
