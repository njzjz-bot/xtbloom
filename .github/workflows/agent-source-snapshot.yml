name: Agent CUDA compile

on:
  push:
    branches:
      - feat/386-gfn1-cuda

permissions:
  contents: read

jobs:
  cuda-compile:
    runs-on: ubuntu-24.04
    container:
      image: nvidia/cuda:12.8.1-devel-ubuntu24.04
    steps:
      - name: Install build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates cmake g++ gcc git ninja-build python3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Apply complete agent worktree patch
        shell: bash
        run: |
          repo=/__w/xtbloom/xtbloom
          git config --global --add safe.directory "$repo"
          cat "$repo"/.github/agent/full.* | base64 -d | gzip -d > /tmp/386-full.patch
          git -C "$repo" apply --check /tmp/386-full.patch
          git -C "$repo" apply /tmp/386-full.patch
          git -C "$repo" diff --check
      - name: Configure CUDA compiler check
        run: |
          repo=/__w/xtbloom/xtbloom
          cmake -S "$repo" -B "$repo/build-agent" -G Ninja \
            -DXTBLOOM_ENABLE_CUDA=ON \
            -DXTBLOOM_BUILD_TESTS=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_ARCHITECTURES=80
      - name: Compile CUDA backend
        run: cmake --build /__w/xtbloom/xtbloom/build-agent --target xtbloom_cuda_backend --parallel 2
