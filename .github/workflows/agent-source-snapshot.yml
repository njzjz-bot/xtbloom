name: Agent CUDA compile

on:
  push:
    branches:
      - feat/386-gfn1-cuda

permissions:
  contents: write

jobs:
  cuda-compile:
    runs-on: ubuntu-24.04
    container:
      image: nvidia/cuda:12.8.1-devel-ubuntu24.04
    steps:
      - name: Install build tools
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -qq -y --no-install-recommends \
            ca-certificates cmake g++ gcc git ninja-build python3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Apply exact source patch
        shell: bash
        run: |
          repo=/__w/xtbloom/xtbloom
          git config --global --add safe.directory "$repo"
          cat "$repo"/.github/agent/x4.* | base64 -d | gzip -d > /tmp/386.patch
          set +e
          set -o pipefail
          {
            git -C "$repo" apply --check \
              --exclude='.github/agent/**' \
              --exclude='.github/workflows/agent-source-snapshot.yml' \
              /tmp/386.patch &&
            git -C "$repo" apply \
              --exclude='.github/agent/**' \
              --exclude='.github/workflows/agent-source-snapshot.yml' \
              /tmp/386.patch &&
            git -C "$repo" diff --check
          } 2>&1 | tee /tmp/apply.log
          echo "${PIPESTATUS[0]}" > /tmp/apply.rc
          exit 0
      - name: Compile staged CUDA backend
        shell: bash
        run: |
          repo=/__w/xtbloom/xtbloom
          apply_rc="$(cat /tmp/apply.rc)"
          if [ "$apply_rc" -ne 0 ]; then
            cp /tmp/apply.log /tmp/cuda-build.log
            echo "$apply_rc" > /tmp/cuda-build.rc
            exit 0
          fi
          set +e
          set -o pipefail
          {
            cmake -S "$repo" -B "$repo/build-agent" -G Ninja \
              -DXTBLOOM_ENABLE_CUDA=ON \
              -DXTBLOOM_BUILD_TESTS=OFF \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_CUDA_ARCHITECTURES=80 &&
            cmake --build "$repo/build-agent" --target xtbloom_cuda_backend --parallel 2
          } 2>&1 | tee /tmp/cuda-build.log
          echo "${PIPESTATUS[0]}" > /tmp/cuda-build.rc
          exit 0
      - name: Publish result branch
        shell: bash
        run: |
          repo=/__w/xtbloom/xtbloom
          cd "$repo"
          git config user.name "njzjz-bot"
          git config user.email "48687836+njzjz-bot@users.noreply.github.com"
          rc="$(cat /tmp/cuda-build.rc)"
          rm -rf build-agent .github/agent .github/workflows/agent-source-snapshot.yml
          if [ "$rc" -ne 0 ]; then
            mkdir -p .agent-diagnostics
            cp /tmp/cuda-build.log .agent-diagnostics/cuda-build.log
          fi
          git add -A
          git commit -m "feat: stage GFN1 CUDA execution" \
            -m "CUDA compile status: $rc" \
            -m "Agent: ChatGPT" \
            -m "Model: GPT-5.6 Sol"
          git push --force origin HEAD:agent/386-cuda-result
          exit "$rc"
